services:

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-controller
    user: root
    ports:
      - "${JENKINS_PORT}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-network


  docker-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: docker-agent
    group_add:
      - "983"
    environment:
      - JENKINS_URL=http://jenkins-controller:8080
      - JENKINS_AGENT_NAME=docker-agent
      - JENKINS_SECRET= 03e9b79bf8dcaa487c773a0f794d5215cd00bdccbea0df2a1965e3fdb361e548
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins-network


volumes:
  jenkins_home:


networks:
  jenkins-network:
